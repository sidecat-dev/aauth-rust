[package]
name = "aauth-rust-resource"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://gitlab.com/sidecat-dev/aauth-rust"
description = "AAuth Resource identity and Person Server authorization before host admission policy"

[dependencies]
aauth-rust-jose.workspace = true
aauth-rust-core.workspace = true
aauth-rust-signature-key.workspace = true
aauth-rust-budgets.workspace = true
aauth-rust-r3.workspace = true
http.workspace = true
httpdate = "1"
serde_json = { workspace = true, features = ["raw_value"] }

[dev-dependencies]
aauth-rust-person-server = { version = "0.1.0-alpha.16", path = "../aauth-rust-person-server" }
aauth-rust-agent.workspace = true
aauth-rust-agent-provider.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rcgen = "0.13"
httparse = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
aauth-rust-access-server = { version = "0.1.0-alpha.16", path = "../aauth-rust-access-server" }
