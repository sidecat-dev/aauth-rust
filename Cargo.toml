[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.11"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://gitlab.com/sidecat-dev/aauth-rust"
homepage = "https://gitlab.com/sidecat-dev/aauth-rust"
readme = "PACKAGE-README.md"
keywords = ["aauth", "authorization", "agent", "ed25519", "http-signatures"]
categories = ["authentication", "cryptography"]

[workspace.dependencies]
aauth-rust-jose = { version = "0.1.0-alpha.11", path = "crates/aauth-rust-jose" }
aauth-rust-signature-key = { version = "0.1.0-alpha.11", path = "crates/aauth-rust-signature-key" }
aauth-rust-core = { version = "0.1.0-alpha.11", path = "crates/aauth-rust-core" }
aauth-rust-agent = { version = "0.1.0-alpha.11", path = "crates/aauth-rust-agent" }
aauth-rust-agent-provider = { version = "0.1.0-alpha.11", path = "crates/aauth-rust-agent-provider" }
aauth-rust-budgets = { version = "0.1.0-alpha.11", path = "crates/aauth-rust-budgets" }
aauth-rust-r3 = { version = "0.1.0-alpha.11", path = "crates/aauth-rust-r3" }
base64 = "0.22"
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
p256 = "=0.13.2"
p384 = "=0.13.1"
rand_core = { version = "0.6", features = ["getrandom"] }
ring = "=0.17.14"
rsa = { version = "=0.9.8", default-features = false, features = ["std", "u64_digit"] }
rustls-pki-types = "=1.15.1"
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
http = "1"
sfv = "0.16"
