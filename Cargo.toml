[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://gitlab.com/sidecat-dev/aauth-rust"
homepage = "https://gitlab.com/sidecat-dev/aauth-rust"
readme = "README.md"
keywords = ["aauth", "authorization", "agent", "ed25519", "http-signatures"]
categories = ["authentication", "cryptography"]

[workspace.dependencies]
aauth-rust-jose = { version = "0.1.0-alpha.1", path = "crates/aauth-rust-jose" }
aauth-rust-signature-key = { version = "0.1.0-alpha.1", path = "crates/aauth-rust-signature-key" }
aauth-rust-core = { version = "0.1.0-alpha.1", path = "crates/aauth-rust-core" }
aauth-rust-agent = { version = "0.1.0-alpha.1", path = "crates/aauth-rust-agent" }
aauth-rust-agent-provider = { version = "0.1.0-alpha.1", path = "crates/aauth-rust-agent-provider" }
base64 = "0.22"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
http = "1"
sfv = "0.16"
