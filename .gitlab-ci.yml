stages: [verify]

variables:
  CARGO_TERM_COLOR: always

# Native targets produce standalone demo artifacts; they are not releases.
.native-unix:
  stage: verify
  before_script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
    - cargo test --locked
    - cargo run --locked -p aauth-rust-resource --example library
    - cargo run --locked -p aauth-rust-resource --example axum
    - cargo run --locked -p aauth-rust-resource --example three-party
    - cargo run --locked -p aauth-rust-person-server-redb --example contracts
    - cargo build --locked --release -p aauth-rust-resource --example direct-identity
    - target/release/examples/direct-identity
    - cp target/release/examples/direct-identity "direct-identity-${TARGET}"
  artifacts:
    name: "aauth-demo-${TARGET}-${CI_COMMIT_SHORT_SHA}"
    paths: [direct-identity-*]
    expire_in: 14 days

linux:
  extends: .native-unix
  image: rust:latest
  parallel:
    matrix:
      - RUNNER: saas-linux-small-amd64
        TARGET: x86_64-unknown-linux-gnu
      - RUNNER: saas-linux-small-arm64
        TARGET: aarch64-unknown-linux-gnu
  tags: [$RUNNER]

# Enable only when the project's corresponding native runners are available.
# GitLab hosted macOS currently needs the appropriate plan/OSS entitlement.
macos:
  extends: .native-unix
  image: macos-15-xcode-16
  tags: [saas-macos-medium-m1]
  variables:
    TARGET: aarch64-apple-darwin
  rules:
    - if: '$AAUTH_NATIVE_RUNNERS == "1"'
  before_script:
    - export PATH="$HOME/.cargo/bin:$PATH"
    - if ! command -v rustup >/dev/null; then curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; fi
    - rustup component add rustfmt clippy

windows:
  stage: verify
  tags: [saas-windows-medium-amd64]
  rules:
    - if: '$AAUTH_NATIVE_RUNNERS == "1"'
  script:
    - |
      $ErrorActionPreference = 'Stop'
      $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
      if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
        Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
        & .\rustup-init.exe -y --profile minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      }
      rustup component add rustfmt clippy
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      cargo fmt --all -- --check
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      cargo clippy --workspace --all-targets --locked -- -D warnings
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      $env:RUSTDOCFLAGS = "-D warnings"
      cargo doc --workspace --no-deps --locked
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      cargo test --locked
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      cargo run --locked -p aauth-rust-resource --example library
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      cargo run --locked -p aauth-rust-resource --example axum
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      cargo run --locked -p aauth-rust-resource --example three-party
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The optional redb adapter requires Unix directory synchronization.
      cargo build --locked --release -p aauth-rust-resource --example direct-identity
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      & target\release\examples\direct-identity.exe
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      Copy-Item target\release\examples\direct-identity.exe direct-identity-x86_64-pc-windows-msvc.exe
  artifacts:
    name: "aauth-demo-windows-${CI_COMMIT_SHORT_SHA}"
    paths: [direct-identity-x86_64-pc-windows-msvc.exe]
    expire_in: 14 days
